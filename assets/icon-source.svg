<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Яркий современный градиент Pink -> Orange -->
    <linearGradient id="devboxGradient" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#FF2A7A" />
      <stop offset="50%" stop-color="#FF5E62" />
      <stop offset="100%" stop-color="#FF9966" />
    </linearGradient>

  </defs>

  <!-- Иконка DevBox в стиле Outline (без фильтров: feDropShadow крошится
       в бандинг на прозрачном фоне adaptive-иконки) -->
  <g>
    <!-- Внешний геокуб (Контейнер DevBox) -->
    <path
      d="M 256,64
         L 432,160
         V 352
         L 256,448
         L 80,352
         V 160
         Z"
      fill="none"
      stroke="url(#devboxGradient)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Вертикальное внутреннее ребро -->
    <path
      d="M 256,272 V 448"
      fill="none"
      stroke="url(#devboxGradient)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Символ Промпта '>' (AI Agent / Dev Environment) -->
    <path
      d="M 160,168 L 224,208 L 160,248"
      fill="none"
      stroke="url(#devboxGradient)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Символ Курсора '_' -->
    <path
      d="M 256,248 H 336"
      fill="none"
      stroke="url(#devboxGradient)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
